[workspace]
members = ["service_arb", "service_arb_core", "service_arb_sources"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/service_arb"
readme = "README.md"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"

[workspace.dependencies]
service_arb_core = { path = "service_arb_core", version = "0.1.0" }
service_arb_sources = { path = "service_arb_sources", version = "0.1.0" }

color-eyre = "0.6"
eyre = "0.6"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.11"
ureq = "3"
zip = "8"
