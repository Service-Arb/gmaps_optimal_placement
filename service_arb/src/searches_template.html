<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__ — searches</title>
<style>
  body{margin:0;padding:18px;font:13px/1.45 system-ui,sans-serif;background:#111;color:#e8e8ea}
  h1{font-size:16px;margin:0 0 2px}
  h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8fa3c8;margin:0 0 6px}
  .sub{color:#8892a0;font-size:11.5px;margin-bottom:14px}
  #chart{height:440px;background:#1b1e23;border-radius:8px}
  .groups{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}
  .g{background:#1b1e23;border-radius:8px;padding:10px 12px;min-width:300px;flex:1}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  td{padding:1px 0;vertical-align:top}
  td:last-child{text-align:right;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
  .k{color:#b8c0cc}
  .none{margin-top:8px;font-size:10.5px;color:#8892a0;line-height:1.4}
</style>
</head>
<body>
<h1>__TITLE__</h1>
<div class="sub" id="sub"></div>
<div id="chart"></div>
<div class="groups" id="groups"></div>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script>
const D = /*__DATA__*/null;
const COLORS = ['#2f6df6','#ff2d55','#00d0ff','#ffb020','#7ae77a','#c78bff'];

document.getElementById('sub').textContent =
  `${D.place} · ${D.months[0]} to ${D.months[D.months.length-1]} · monthly searches, summed over each group's keywords`;

Plotly.newPlot('chart', D.groups.map((g,i) => ({
  x: D.months, y: g.total, name: g.name, type: 'scatter', mode: 'lines+markers',
  line: {color: COLORS[i % COLORS.length], width: 2},
})), {
  paper_bgcolor: '#1b1e23', plot_bgcolor: '#1b1e23',
  font: {color: '#b8c0cc', family: 'system-ui, sans-serif', size: 11.5},
  margin: {t: 20, r: 16, b: 40, l: 56},
  xaxis: {gridcolor: '#2a2f38'},
  yaxis: {gridcolor: '#2a2f38', rangemode: 'tozero', title: 'searches / month'},
  legend: {orientation: 'h', y: 1.12},
  hovermode: 'x unified',
}, {responsive: true, displayModeBar: false});

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('groups').innerHTML = D.groups.map(g => `
  <div class="g">
    <h2>${esc(g.name)} — ${g.members.length} keywords</h2>
    <table>${g.members.map(m => `<tr><td class="k">${esc(m.text)}</td><td>${m.avg}</td></tr>`).join('')}</table>
    ${g.no_data.length ? `<div class="none">No data at this place, excluded from the sum rather than counted as zero:
      ${g.no_data.map(esc).join(', ')}</div>` : ''}
  </div>`).join('');
</script>
</body>
</html>
